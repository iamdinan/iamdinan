name: Update README

on:
  schedule:
    - cron: "30 18 * * *" # 12:00 AM Sri Lanka time (UTC+5:30)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update cache-bust timestamp
        env:
          TZ: Asia/Colombo
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M)
          sed -i -E "s/([?&]t=)[0-9]+/\1$TIMESTAMP/" README.md

      - name: Commit and push
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes to commit"
            exit 0
          fi

          git config user.name "Dinan Dilmith"
          git config user.email "118002808+iamdinan@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update streak stats timestamp"
          git push origin HEAD:${GITHUB_REF_NAME}
