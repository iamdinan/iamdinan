name: Update README

on:
  schedule:
   - cron: '30 18 * * *'  # 12:00 AM Sri Lanka time (UTC+5:30)
  workflow_dispatch:
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update cache-bust timestamp
        run: |
          DATE=$(date +%Y%m%d)
          sed -i "s/&t=[0-9]*/\&t=$DATE/" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "chore: update streak stats timestamp" || echo "No changes"
          git push
